<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src blob: data:; worker-src blob:; connect-src blob: https://cdnjs.cloudflare.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>ضاغط PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;--h:195;
  --bg:light-dark(oklch(97% .012 var(--h)),oklch(17% .025 var(--h)));
  --surface:light-dark(oklch(100% 0 0),oklch(22% .03 var(--h)));
  --surface-2:light-dark(oklch(95% .015 var(--h)),oklch(27% .03 var(--h)));
  --ink:light-dark(oklch(22% .03 var(--h)),oklch(95% .01 var(--h)));
  --mute:light-dark(oklch(46% .03 var(--h)),oklch(76% .03 var(--h)));
  --line:light-dark(oklch(89% .02 var(--h)),oklch(33% .03 var(--h)));
  --primary:light-dark(oklch(48% .12 var(--h)),oklch(80% .13 var(--h)));
  --on-primary:light-dark(#fff,oklch(18% .03 var(--h)));
  --accent:oklch(82% .19 135);
  --danger:light-dark(oklch(50% .2 25),oklch(75% .15 25));
  --ease:cubic-bezier(.22,1,.36,1);
  --f-d:'Alexandria',system-ui,sans-serif;--f-b:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 clamp(.95rem,.9rem + .3vw,1.05rem)/1.7 var(--f-b);background:var(--bg);color:var(--ink);min-height:100dvh;overflow-x:hidden;padding-block:max(16px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-bottom))}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.35;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:oklch(75% .12 var(--h));inset-block-start:-25vmax;inset-inline-start:-20vmax}
.bg i:nth-child(2){background:oklch(82% .17 135);inset-block-end:-30vmax;inset-inline-end:-25vmax;animation-delay:-8s;opacity:.22}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
main{max-width:560px;margin-inline:auto;padding-inline:16px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px;padding-block:6px}
.mark{inline-size:44px;block-size:44px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
h1{font:800 1.3rem/1.2 var(--f-d)}
.sub{color:var(--mute);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:14px;animation:in .5s var(--ease) both}
@starting-style{.card{opacity:0;translate:0 14px}}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
[hidden]{display:none!important}
svg.i{inline-size:22px;block-size:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mir{transform:scaleX(-1)}
button,label.btn,summary{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-block-size:48px;padding-inline:20px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent;inline-size:100%;min-block-size:54px;font-size:1.05rem}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.hero{display:grid;place-items:center;padding-block:4px}
.hero svg{inline-size:min(220px,60%);height:auto;overflow:visible}
.plate{fill:var(--primary);transition:transform .45s var(--ease)}
.pt{transform:translateY(calc(var(--p,0)*17px))}
.pb{transform:translateY(calc(var(--p,0)*-17px))}
.doc{fill:var(--surface);stroke:var(--ink);stroke-width:2;transform-box:fill-box;transform-origin:center;transform:scaleY(calc(1 - var(--p,0)*.6));transition:transform .45s var(--ease)}
.ln{stroke:var(--mute);stroke-width:2;stroke-linecap:round;transform-box:fill-box;transform-origin:center;transform:scaleY(calc(1 - var(--p,0)*.6));transition:transform .45s var(--ease)}
.idle .doc,.idle .ln{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(.94)}}
#drop{border:2px dashed var(--line);border-radius:18px;padding:22px 14px;text-align:center;display:grid;gap:10px;justify-items:center;transition:border-color .2s,background .2s}
#drop.over{border-color:var(--primary);background:var(--surface-2)}
#drop p{color:var(--mute);font-size:.9rem}
input[type=file]{position:absolute;inline-size:1px;block-size:1px;opacity:0}
.info{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-inline-size:52vw;direction:ltr;text-align:start}
.info span{color:var(--mute);font-size:.85rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{position:relative;display:grid;gap:2px;justify-items:center;text-align:center;padding:10px 6px;min-block-size:64px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.seg label:active{transform:scale(.97)}
.seg label:has(:checked){border-color:var(--primary);background:var(--surface-2)}
.seg label:has(:focus-visible){outline:3px solid var(--primary);outline-offset:2px}
.seg small{color:var(--mute);font-size:.75rem}
.seg b{font-size:.92rem}
.fld{display:grid;gap:6px;font-weight:500;font-size:.9rem}
.fld small{color:var(--mute);font-weight:400}
input[type=text],input[type=number]{font:inherit;color:inherit;inline-size:100%;min-block-size:48px;padding-inline:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);direction:ltr;text-align:start}
input[type=range]{inline-size:100%;accent-color:var(--primary);min-block-size:44px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-block-size:44px}
.sw input{inline-size:44px;block-size:26px;accent-color:var(--primary)}
details{border:1px solid var(--line);border-radius:16px;padding-inline:14px}
summary{min-block-size:48px;display:flex;align-items:center;justify-content:space-between;list-style:none;font-weight:600}
summary::-webkit-details-marker{display:none}
summary svg{transition:transform .3s var(--ease)}
details[open] summary svg{transform:rotate(90deg)}
details>div{display:grid;gap:14px;padding-block:4px 16px}
.bar{block-size:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;block-size:100%;inline-size:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transform-origin:right;transform:scaleX(var(--v,0));transition:transform .35s var(--ease)}
.stats{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.sk{block-size:14px;border-radius:8px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.big{font:800 clamp(1.5rem,6vw,2rem)/1.2 var(--f-d);display:flex;flex-wrap:wrap;align-items:center;gap:8px;direction:ltr;justify-content:center;font-variant-numeric:tabular-nums}
.big em{font-style:normal;color:var(--mute);font-weight:500;font-size:.95rem}
.save{display:inline-block;margin-inline:auto;background:var(--accent);color:oklch(25% .06 135);font-weight:700;padding:4px 14px;border-radius:99px;font-size:.95rem}
.part{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:16px;padding:10px 12px}
.part div{flex:1;min-inline-size:0}
.part b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.part span{color:var(--mute);font-size:.82rem}
.ic{inline-size:44px;block-size:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ic:active{transform:scale(.94)}
#msg{color:var(--danger);font-weight:500;font-size:.92rem}
#upd{background:var(--accent);color:oklch(25% .06 135);border-radius:14px;padding:10px 14px;font-weight:600;text-align:center}
.note{color:var(--mute);font-size:.8rem;text-align:center}
#test{white-space:pre-wrap;direction:ltr;font:13px/1.6 monospace;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-press" viewBox="0 0 24 24"><path d="M4 5h16M4 19h16M8 9l4 3 4-3M8 15l4-3 4 3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.2"/><circle cx="17.5" cy="6" r="2.2"/><circle cx="17.5" cy="18" r="2.2"/><path d="M8 11l7.5-4M8 13l7.5 4"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7.5 9L12 4.5 16.5 9M5 20h14"/></symbol>
  <symbol id="i-txt" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></symbol>
</svg>

<main id="app">
  <div id="upd" hidden role="status"></div>
  <header>
    <div class="mark"><svg class="i"><use href="#i-press"/></svg></div>
    <div><h1 id="brand"></h1><div class="sub" id="tag"></div></div>
  </header>

  <div class="hero idle" id="hero" style="--p:0">
    <svg viewBox="0 0 120 84" aria-hidden="true">
      <rect class="plate pt" x="10" y="4" width="100" height="10" rx="5"/>
      <rect class="doc" x="30" y="20" width="60" height="44" rx="5"/>
      <line class="ln" x1="40" y1="32" x2="80" y2="32"/><line class="ln" x1="40" y1="42" x2="80" y2="42"/><line class="ln" x1="40" y1="52" x2="66" y2="52"/>
      <rect class="plate pb" x="10" y="70" width="100" height="10" rx="5"/>
    </svg>
  </div>

  <section class="card" id="pick">
    <div id="drop">
      <svg class="i" style="inline-size:34px;block-size:34px;color:var(--primary)"><use href="#i-up"/></svg>
      <label class="btn pri" style="inline-size:auto" for="f"><span id="pickTxt">اختر ملف PDF</span></label>
      <input id="f" type="file" accept="application/pdf,.pdf">
      <p>أو اسحب الملف هنا. المعالجة تتم على جهازك بالكامل.</p>
    </div>
    <div id="load" hidden><div class="sk" style="inline-size:70%"></div><div class="sk" style="inline-size:45%;margin-top:8px"></div></div>
    <p id="msg" role="alert" hidden></p>
  </section>

  <section class="card" id="opts" hidden>
    <div class="info"><svg class="i"><use href="#i-file"/></svg><div><b id="fName"></b><span id="fMeta"></span></div></div>
    <div class="seg" id="presets" role="radiogroup" aria-label="قوة الضغط"></div>
    <label class="fld">الصفحات المطلوبة <small>اتركه فارغاً لكل الصفحات. مثال: 1-30, 45, 60-80</small>
      <input type="text" id="range" inputmode="text" autocomplete="off" placeholder="الكل">
    </label>
    <label class="sw"><span>تحويل لأبيض وأسود (حجم أصغر)</span><input type="checkbox" id="gray"></label>
    <label class="sw"><span>ملف نص مرافق (.txt) للصفحات النصية</span><input type="checkbox" id="text"></label>
    <details>
      <summary>خيارات متقدمة <svg class="i mir"><use href="#i-chev"/></svg></summary>
      <div>
        <label class="fld"><span>أطول ضلع للصفحة: <b id="vSide"></b> px</span><input type="range" id="side" min="700" max="2400" step="100"></label>
        <label class="fld"><span>جودة JPEG: <b id="vQ"></b>%</span><input type="range" id="q" min="20" max="90" step="5"></label>
        <label class="fld">أقصى حجم للجزء (ميجا)<input type="number" id="maxMB" min="1" max="500" inputmode="numeric"></label>
        <label class="fld">أقصى عدد صفحات للجزء<input type="number" id="maxPages" min="1" max="1000" inputmode="numeric"></label>
      </div>
    </details>
    <button class="btn pri" id="go" type="button">ابدأ الضغط</button>
  </section>

  <section class="card" id="prog" hidden aria-live="polite">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i></i></div>
    <div class="stats"><span>صفحة <b id="pN">0</b> من <b id="pT">0</b></span><span>الحجم الحالي <b id="pS">0</b></span></div>
    <button class="btn" id="cancel" type="button"><svg class="i"><use href="#i-x"/></svg>إلغاء</button>
  </section>

  <section class="card" id="res" hidden>
    <div class="big"><span id="rFrom"></span><em>←</em><span id="rTo"></span></div>
    <span class="save" id="rSave"></span>
    <div id="parts" style="display:grid;gap:8px"></div>
    <button class="btn" id="again" type="button">ملف جديد</button>
  </section>

  <p class="note" id="note"></p>
  <pre id="test" hidden></pre>
</main>

<script>
'use strict';
/* ===== CONFIG ===== */
const CONFIG={
  brand:{name:'ضاغط PDF',tagline:'صغّر كتابك ليُرفع بسهولة',hue:195},
  version:'1.0.0',
  updateUrl:'https://raw.githubusercontent.com/Dev-saged/pdf/main/version.json',
  license:{expiry:null},      // 'YYYY-MM-DD' أو null
  cdn:{
    lib:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    worker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
  },
  defaults:{preset:'strong',maxMB:25,maxPages:100},
  presets:{
    strong:{label:'قوي',hint:'متوازن',maxSide:1600,q:.55},
    extreme:{label:'قوي جداً',hint:'أصغر',maxSide:1280,q:.45},
    max:{label:'أقصى',hint:'أدنى حجم',maxSide:1000,q:.35,gray:true}
  }
};

/* ===== أدوات ===== */
const $=s=>document.querySelector(s);
const fmt=b=>b>=1048576?(b/1048576).toFixed(1)+' ميجا':Math.max(1,Math.round(b/1024))+' كيلو';
const norm=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const buzz=p=>{if(!calm())try{navigator.vibrate&&navigator.vibrate(p)}catch{}};
const store=o=>{const subs=new Set();let q=0;
  const p=new Proxy(o,{set(t,k,v){t[k]=v;if(!q){q=1;requestAnimationFrame(()=>{q=0;subs.forEach(f=>f(t))})}return true}});
  return[p,f=>subs.add(f)]};
const KEY='ppc.cfg';
const loadCfg=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}};
const saveCfg=()=>{try{const{preset,gray,text,maxSide,q,maxMB,maxPages}=cfg;localStorage.setItem(KEY,JSON.stringify({preset,gray,text,maxSide,q,maxMB,maxPages}))}catch{}};

/* ===== الحالة ===== */
const[S,sub]=store({phase:'idle',msg:'',name:'',size:0,total:0,done:0,bytes:0,parts:[]});
const D0=CONFIG.presets[CONFIG.defaults.preset];
const cfg=Object.assign({preset:CONFIG.defaults.preset,gray:false,text:true,maxSide:D0.maxSide,q:D0.q*100,maxMB:CONFIG.defaults.maxMB,maxPages:CONFIG.defaults.maxPages,range:''},loadCfg());
let doc=null,file=null,cancelled=false;

/* ===== كاتب PDF ===== */
class PdfPart{
  constructor(){this.pages=[];this.size=0;this.first=0;this.last=0}
  add(p,n){if(!this.pages.length)this.first=n;this.last=n;this.pages.push(p);this.size+=p.blob.size+260}
  build(){
    const enc=new TextEncoder(),chunks=[],off=[];let pos=0;
    const push=c=>{chunks.push(c);pos+=c instanceof Blob?c.size:c.length};
    const str=s=>push(enc.encode(s));
    const obj=(id,fn)=>{off[id]=pos;str(id+' 0 obj\n');fn();str('\nendobj\n')};
    const n=this.pages.length;
    push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,0xE2,0xE3,0xCF,0xD3,10]));
    obj(1,()=>str('<</Type/Catalog/Pages 2 0 R>>'));
    obj(2,()=>str('<</Type/Pages/Count '+n+'/Kids['+this.pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>'));
    this.pages.forEach((p,i)=>{
      const id=3+3*i,c=`q ${p.w} 0 0 ${p.h} 0 0 cm /I Do Q`;
      obj(id,()=>str(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${p.w} ${p.h}]/Resources<</XObject<</I ${id+2} 0 R>>>>/Contents ${id+1} 0 R>>`));
      obj(id+1,()=>str(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
      obj(id+2,()=>{str(`<</Type/XObject/Subtype/Image/Width ${p.pw}/Height ${p.ph}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.blob.size}>>\nstream\n`);push(p.blob);str('\nendstream')});
    });
    const total=3+3*n,xr=pos;
    str(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for(let i=1;i<total;i++)str(String(off[i]).padStart(10,'0')+' 00000 n \n');
    str(`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
    return new Blob(chunks,{type:'application/pdf'});
  }
}

function parsePages(s,n){
  s=norm(s).trim();
  if(!s)return Array.from({length:n},(_,i)=>i+1);
  const set=new Set();
  for(const part of s.split(/[,،\s]+/)){
    if(!part)continue;
    const m=part.match(/^(\d+)(?:-(\d+))?$/);
    if(!m)throw new Error('نطاق غير صالح: '+part);
    let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];
    for(let i=Math.max(1,a);i<=Math.min(n,b);i++)set.add(i);
  }
  if(!set.size)throw new Error('لا صفحات ضمن النطاق (عدد الصفحات '+n+')');
  return[...set].sort((x,y)=>x-y);
}

/* ===== pdf.js ===== */
let libP=null;
function loadLib(){
  return libP||(libP=new Promise((res,rej)=>{
    if(window.pdfjsLib)return res();
    const s=document.createElement('script');
    s.src=CONFIG.cdn.lib;
    s.onload=async()=>{try{
      const t=await(await fetch(CONFIG.cdn.worker)).text();
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));res()
    }catch(e){rej(e)}};
    s.onerror=()=>rej(new Error('net'));
    document.head.append(s);
  }).catch(e=>{libP=null;throw e}));
}

function eff(){
  const p=CONFIG.presets[cfg.preset];
  return{maxSide:cfg.maxSide,q:cfg.q/100,gray:cfg.gray||!!(p&&p.gray&&cfg.preset!=='custom')};
}

async function renderPage(i,o,withText){
  const page=await doc.getPage(i);
  const v1=page.getViewport({scale:1});
  const sc=Math.min(3,o.maxSide/Math.max(v1.width,v1.height));
  const vp=page.getViewport({scale:sc});
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(vp.width));cv.height=Math.max(1,Math.round(vp.height));
  const ctx=cv.getContext('2d',{willReadFrequently:o.gray});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  if(o.gray){
    const d=ctx.getImageData(0,0,cv.width,cv.height),a=d.data;
    for(let k=0;k<a.length;k+=4){a[k]=a[k+1]=a[k+2]=(a[k]*77+a[k+1]*150+a[k+2]*29)>>8}
    ctx.putImageData(d,0,0);
  }
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',o.q));
  if(!blob)throw new Error('تعذّر ترميز الصفحة '+i+' (الذاكرة غير كافية؟ قلّل أطول ضلع)');
  let text='';
  if(withText){try{text=(await page.getTextContent()).items.map(x=>x.str).join(' ').trim()}catch{}}
  const out={w:+v1.width.toFixed(2),h:+v1.height.toFixed(2),pw:cv.width,ph:cv.height,blob,text};
  cv.width=cv.height=0;page.cleanup();
  return out;
}

/* ===== التنفيذ ===== */
async function openFile(f){
  if(!f)return;
  if(f.type&&f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){S.msg='الملف ليس PDF';return}
  S.msg='';S.phase='loading';file=f;
  try{
    await loadLib();
    if(doc){try{doc.destroy()}catch{}}
    const url=URL.createObjectURL(f);
    doc=await pdfjsLib.getDocument({url,isEvalSupported:false,disableAutoFetch:true}).promise;
    S.name=f.name;S.size=f.size;S.total=doc.numPages;S.phase='ready';
  }catch(e){
    S.phase='idle';
    S.msg=e&&e.name==='PasswordException'?'الملف محمي بكلمة سر':e&&e.message==='net'||e instanceof TypeError?'تعذّر تحميل المكتبة، تحتاج اتصالاً بالإنترنت أول مرة':'تعذّر فتح الملف';
  }
}

async function run(){
  let pages;
  try{pages=parsePages($('#range').value,doc.numPages)}catch(e){S.msg=e.message;return}
  S.msg='';cancelled=false;S.parts=[];S.done=0;S.bytes=0;
  const o=eff(),maxBytes=Math.max(1,cfg.maxMB)*1048576,maxPages=Math.max(1,cfg.maxPages|0);
  const base=(S.name.replace(/\.pdf$/i,'')||'document')+'-small';
  const texts=[];let part=new PdfPart(),finished=0,n=0;
  S.total=pages.length;S.phase='working';
  const flush=()=>{
    if(!part.pages.length)return;
    n++;const blob=part.build();finished+=blob.size;
    S.parts=[...S.parts,{name:`${base}-${String(n).padStart(2,'0')}.pdf`,blob,meta:`الصفحات ${part.first}–${part.last}`}];
    part=new PdfPart();
  };
  try{
    for(let k=0;k<pages.length;k++){
      if(cancelled)break;
      const pg=await renderPage(pages[k],o,cfg.text);
      if(part.pages.length&&(part.size+pg.blob.size>maxBytes||part.pages.length>=maxPages))flush();
      part.add(pg,pages[k]);
      if(pg.text)texts.push(`=== صفحة ${pages[k]} ===\n${pg.text}`);
      S.done=k+1;S.bytes=finished+part.size;
    }
    if(cancelled){S.phase='ready';S.parts=[];return}
    flush();
    if(cfg.text&&texts.length){
      const blob=new Blob(['\ufeff'+texts.join('\n\n')],{type:'text/plain;charset=utf-8'});
      S.parts=[...S.parts,{name:base+'-text.txt',blob,meta:'النص المستخرج',txt:true}];
    }
    S.bytes=S.parts.filter(p=>!p.txt).reduce((a,p)=>a+p.blob.size,0);
    S.phase='done';buzz([30,40,30]);
  }catch(e){S.phase='ready';S.msg=e.message||'حدث خطأ أثناء الضغط'}
}

/* ===== عرض ===== */
const show=(id,v)=>{$(id).hidden=!v};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h)h.forEach(x=>e.append(x));return e};
const icon=id=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#'+id);s.append(u);return s};
let lastPhase='',lastParts=null;

function download(p){const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=p.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);buzz(15)}
async function share(p){
  const f=new File([p.blob],p.name,{type:p.blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else download(p)}catch{}
}

function countTo(elm,from,to){
  if(calm()){elm.textContent=fmt(to);return}
  const t0=performance.now(),d=1000;
  const tick=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);elm.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}

sub(s=>{
  const ph=s.phase;
  show('#pick',ph==='idle'||ph==='loading');
  show('#drop',ph==='idle');show('#load',ph==='loading');
  show('#opts',ph==='ready');show('#prog',ph==='working');show('#res',ph==='done');
  const m=$('#msg');m.hidden=!s.msg;m.textContent=s.msg;
  const hero=$('#hero');
  hero.classList.toggle('idle',ph!=='working'&&ph!=='done');
  hero.style.setProperty('--p',ph==='done'?1:ph==='working'&&s.total?(s.done/s.total*.9):0);
  if(ph==='ready'){
    $('#fName').textContent=s.name;
    $('#fMeta').textContent=`${fmt(s.size)} · ${doc?doc.numPages:s.total} صفحة`;
  }
  if(ph==='working'){
    const v=s.total?s.done/s.total:0;
    $('#bar').style.setProperty('--v',v);$('#bar').setAttribute('aria-valuenow',Math.round(v*100));
    $('#pN').textContent=s.done;$('#pT').textContent=s.total;$('#pS').textContent=fmt(s.bytes);
  }
  if(ph==='done'&&lastPhase!=='done'){
    $('#rFrom').textContent=fmt(s.size);
    countTo($('#rTo'),s.size,s.bytes);
    const pct=Math.max(0,Math.round((1-s.bytes/s.size)*100));
    $('#rSave').textContent=`وفّرت ${pct}%`;
  }
  if(s.parts!==lastParts){
    lastParts=s.parts;
    const box=$('#parts');box.replaceChildren();
    s.parts.forEach(p=>{
      const b1=el('button','ic'),b2=el('button','ic');
      b1.type=b2.type='button';
      b1.setAttribute('aria-label','تنزيل '+p.name);b2.setAttribute('aria-label','مشاركة '+p.name);
      b1.append(icon('i-dl'));b2.append(icon('i-share'));
      b1.onclick=()=>download(p);b2.onclick=()=>share(p);
      const nm=el('b'),mt=el('span');nm.textContent=p.name;mt.textContent=`${fmt(p.blob.size)} · ${p.meta}`;
      box.append(el('div','part',[icon(p.txt?'i-txt':'i-file'),el('div','',[nm,mt]),b2,b1]));
    });
  }
  lastPhase=ph;
});

/* ===== ربط الواجهة ===== */
function buildPresets(){
  const box=$('#presets');
  Object.entries(CONFIG.presets).forEach(([k,p])=>{
    const lb=el('label'),inp=el('input');
    inp.type='radio';inp.name='pre';inp.value=k;inp.style.cssText='position:absolute;opacity:0';
    const b=el('b'),sm=el('small');b.textContent=p.label;sm.textContent=p.hint;
    lb.append(inp,b,sm);box.append(lb);
    inp.onchange=()=>{cfg.preset=k;cfg.maxSide=p.maxSide;cfg.q=p.q*100;cfg.gray=!!p.gray;syncInputs();saveCfg();buzz(8)};
  });
}
function syncInputs(){
  document.querySelectorAll('#presets input').forEach(i=>i.checked=i.value===cfg.preset);
  $('#side').value=cfg.maxSide;$('#vSide').textContent=cfg.maxSide;
  $('#q').value=cfg.q;$('#vQ').textContent=cfg.q;
  $('#gray').checked=cfg.gray;$('#text').checked=cfg.text;
  $('#maxMB').value=cfg.maxMB;$('#maxPages').value=cfg.maxPages;
}
function bind(){
  $('#side').oninput=e=>{cfg.maxSide=+e.target.value;cfg.preset='custom';syncInputs();saveCfg()};
  $('#q').oninput=e=>{cfg.q=+e.target.value;cfg.preset='custom';syncInputs();saveCfg()};
  $('#gray').onchange=e=>{cfg.gray=e.target.checked;saveCfg()};
  $('#text').onchange=e=>{cfg.text=e.target.checked;saveCfg()};
  $('#maxMB').onchange=e=>{cfg.maxMB=Math.max(1,+e.target.value||CONFIG.defaults.maxMB);syncInputs();saveCfg()};
  $('#maxPages').onchange=e=>{cfg.maxPages=Math.max(1,+e.target.value||CONFIG.defaults.maxPages);syncInputs();saveCfg()};
  $('#f').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
  $('#go').onclick=()=>{buzz(20);run()};
  $('#cancel').onclick=()=>{cancelled=true};
  $('#again').onclick=()=>{S.parts=[];S.msg='';S.phase='ready'};
  const d=$('#drop');
  ['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));
}

/* ===== تحديث تلقائي ===== */
async function checkUpdate(){
  if(!CONFIG.updateUrl)return;
  try{
    const r=await fetch(CONFIG.updateUrl,{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).version||'';
    const a=v.split('.').map(Number),b=CONFIG.version.split('.').map(Number);
    if(a.some((x,i)=>x!==b[i])&&(a[0]-b[0]||a[1]-b[1]||a[2]-b[2])>0){
      const u=$('#upd');u.textContent='يتوفر إصدار أحدث: '+v;u.hidden=false;
    }
  }catch{}
}

/* ===== اختبار ذاتي (#test) ===== */
async function selfTest(){
  const out=[],ok=(n,c)=>out.push((c?'PASS ':'FAIL ')+n);
  ok('range all',parsePages('',5).length===5);
  ok('range mix',parsePages('1-3, 5',9).join()==='1,2,3,5');
  ok('range arabic digits',parsePages('٢-٣',9).join()==='2,3');
  ok('range reversed',parsePages('4-2',9).join()==='2,3,4');
  try{parsePages('x',5);ok('range invalid',false)}catch{ok('range invalid',true)}
  try{parsePages('50',5);ok('range out',false)}catch{ok('range out',true)}
  const part=new PdfPart();
  for(let i=1;i<=3;i++)part.add({w:595,h:842,pw:10,ph:10,blob:new Blob([new Uint8Array(50).fill(i)])},i);
  const buf=new Uint8Array(await part.build().arrayBuffer()),txt=new TextDecoder('latin1').decode(buf);
  ok('header',txt.startsWith('%PDF-1.4'));
  const sx=+txt.match(/startxref\n(\d+)/)[1];
  ok('startxref->xref',txt.slice(sx,sx+4)==='xref');
  const offs=[...txt.matchAll(/(\d{10}) 00000 n /g)].map(m=>+m[1]);
  ok('xref entries',offs.length===3*3+2-0&&offs.every((o,i)=>txt.slice(o).startsWith((i+1)+' 0 obj')));
  ok('eof',txt.trimEnd().endsWith('%%EOF'));
  ok('fmt',fmt(1048576)==='1.0 ميجا'&&fmt(2048)==='2 كيلو');
  const t=$('#test');t.hidden=false;t.textContent=out.join('\n');
}

/* ===== تشغيل ===== */
(function boot(){
  document.documentElement.style.setProperty('--h',CONFIG.brand.hue);
  document.title=CONFIG.brand.name;
  $('#brand').textContent=CONFIG.brand.name;$('#tag').textContent=CONFIG.brand.tagline;
  if(CONFIG.license.expiry&&new Date(CONFIG.license.expiry)<new Date()){
    document.querySelector('main').replaceChildren(el('p','card',[document.createTextNode('انتهت صلاحية الترخيص')]));return;
  }
  buildPresets();bind();syncInputs();
  $('#note').textContent='الناتج صفحات مصوّرة تقرؤها النماذج بالرؤية. الملف الأصلي لا يتغيّر.';
  loadLib().catch(()=>{$('#note').textContent='أول تشغيل يحتاج إنترنت لتحميل مكتبة القراءة (pdf.js).'});
  checkUpdate();
  if(location.hash==='#test')selfTest();
})();
